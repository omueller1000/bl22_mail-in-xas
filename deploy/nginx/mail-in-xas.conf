# nginx for the BL22 mail-in XAS portal (requirements §2, §12).
# Install: copy to /etc/nginx/conf.d/mail-in-xas.conf and replace PROXY_IP (see deploy/INSTALL.md).
#
#   /mail-in-xas/                 production frontend (static files)
#   /mail-in-xas/api/             production backend   (127.0.0.1:8008)
#   /mail-in-xas/dev/             dev frontend         ┐ only directly on the VM's internal
#   /mail-in-xas/dev/api/         dev backend          ┘ hostname, never via the SLAC proxy
#   */api/instrument/             control software only, never via the SLAC proxy

# Requests that arrive through the public SLAC reverse proxy (HAProxy, load balanced) may not
# reach dev or the instrument API. A request counts as proxied if it comes from a proxy address
# OR carries X-Forwarded-Host, which the proxy adds to every request and direct clients on the
# internal network do not send. So the check fails closed if the proxy's addresses change.
geo $from_proxy_ip {
    default     0;
    PROXY_IP    1;  # the SLAC reverse proxy's address; one line per address or a CIDR range
}
map "$from_proxy_ip:$http_x_forwarded_host" $via_public_proxy {
    "0:"        0;
    default     1;
}

upstream ht_xas_prod { server 127.0.0.1:8008; }
upstream ht_xas_dev  { server 127.0.0.1:8009; }

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /SSRL_LOCAL_OM/ht-xas/www;

    # Redirects carry only the path: the VM sees plain HTTP behind the TLS proxy, and an absolute
    # Location would send browsers to http://.
    absolute_redirect off;

    # Sweep uploads are limited to 12 MB by the backend.
    client_max_body_size 13m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;  # ZIP exports of large frames

    location = / {
        return 302 /mail-in-xas/;
    }

    # --- production ------------------------------------------------------------------------

    # Without the trailing slash no location below matches.
    location = /mail-in-xas {
        return 301 /mail-in-xas/;
    }

    location /mail-in-xas/api/instrument/ {
        if ($via_public_proxy) { return 403; }
        proxy_pass http://ht_xas_prod;
    }

    location /mail-in-xas/api/ {
        proxy_pass http://ht_xas_prod;
    }

    location /mail-in-xas/assets/ {
        alias /SSRL_LOCAL_OM/ht-xas/www/prod/assets/;
        expires 1y;  # file names contain a content hash
        add_header Cache-Control "public, immutable";
    }

    location /mail-in-xas/ {
        alias /SSRL_LOCAL_OM/ht-xas/www/prod/;
        # Unknown paths are app routes: serve the app, which shows the page.
        try_files $uri $uri/ /mail-in-xas/index.html;
        add_header Cache-Control "no-cache";
    }

    # --- dev (not via the SLAC proxy) ------------------------------------------------------

    location = /mail-in-xas/dev {
        if ($via_public_proxy) { return 404; }
        return 301 /mail-in-xas/dev/;
    }

    location /mail-in-xas/dev/api/ {
        if ($via_public_proxy) { return 404; }
        proxy_pass http://ht_xas_dev;
    }

    location /mail-in-xas/dev/assets/ {
        if ($via_public_proxy) { return 404; }
        alias /SSRL_LOCAL_OM/ht-xas/www/dev/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /mail-in-xas/dev/ {
        if ($via_public_proxy) { return 404; }
        alias /SSRL_LOCAL_OM/ht-xas/www/dev/;
        try_files $uri $uri/ /mail-in-xas/dev/index.html;
        add_header Cache-Control "no-cache";
    }
}
