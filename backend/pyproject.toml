[project]
name = "ht-xas-backend"
version = "0.1.0"
description = "Backend of the BL22 Mail-in XAS portal"
requires-python = ">=3.12,<3.13"
dependencies = [
    "email-validator>=2.3.0",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "pymongo>=4.18.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
log_level = "WARNING"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "db: needs a reachable MongoDB (set HT_XAS_TEST_MONGODB_URI); skipped otherwise",
]
